server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html is never cached -- it's the only unhashed file, and the
    # ones users kept reporting as "nothing changed" was almost certainly
    # a stale cached copy of this exact file pointing at an old JS bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Vite content-hashes every built asset filename, so these are safe to
    # cache aggressively -- a new build always gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side router (react-router) -- unknown paths fall back to
    # index.html rather than a bare nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
