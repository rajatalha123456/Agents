<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contract Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c2b3a;
      --ink-soft: #4a5a6a;
      --paper: #f6f4ef;
      --paper-raised: #ffffff;
      --line: #d8d3c6;
      --brass: #9c7a32;
      --brass-dim: #c9ac6a;
      --danger: #a6402f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.5;
    }
    .shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    .mast {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 40px;
    }
    .mast h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 28px;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .mast .tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--brass);
    }
    .flash {
      background: #fbeceb;
      border: 1px solid #e3b6b0;
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 24px;
    }
    a { color: var(--brass); }
    .footnote {
      margin-top: 48px;
      font-size: 13px;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="mast">
      <h1>Contract Analyzer</h1>
      <span class="tag">local / private</span>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
