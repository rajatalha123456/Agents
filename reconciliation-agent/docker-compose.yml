
# Local development defaults for P0 (Postgres) and P5 (Celery's broker).
# `docker compose up -d` + the defaults already baked into
# core/config.py (Settings.database_url) and workbench/scheduler.py
# (REDIS_URL) need zero further configuration to run locally.
#
# This is a separate, disposable local-dev database — it is not the
# ad hoc RLS-verification container documented in README's "Verify"
# section (scripts/Test-Database.ps1), which intentionally uses its own
# port/credentials from .data/postgres-test.env so the two never collide.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: reconciliation
    ports:
      - "5432:5432"
    volumes:
      - recon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recon_postgres_data:
