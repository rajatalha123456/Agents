[project]
name = "reconciliation-agent"
version = "0.1.0"
description = "Standalone, domain-agnostic reconciliation agent — core engine + pluggable rule packs (Build Plan v3)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
matching = [
    "polars>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
]
bankformats = [
    "mt-940>=4.30",
    "lxml>=5.2",
    "openpyxl>=3.1",
]
jobs = ["celery[redis]>=5.4,<6"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
# A stale, ACL-locked "pytest-of-<user>" folder can accumulate under the
# Windows system temp dir and deny tmp_path access to every test in a run.
# Keeping pytest's basetemp inside the repo avoids depending on that
# directory's permissions at all.
addopts = "--basetemp=.pytest_tmp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
